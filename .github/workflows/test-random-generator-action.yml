name: 2-Test Composite Action

on:
  workflow_dispatch:

jobs:
  runs-custom-action:
    runs-on: ubuntu-latest
    steps:
      # Step 1
      - name: Checkout Repository
        uses: actions/checkout@v3.3.0
  
      #step 2 
      - name: call random generator action
        id: custom_rng
        uses: ./.github/actions/random-generator
        with:
          user-name: 'Vic'
  
      #step 3
      - name: Use the returned random number
        run: |
          echo "the composite action successfully returned the number: ${{ steps.custom_rng.outputs.generated-number }}"
